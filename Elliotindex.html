<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#F5EDD7">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="숙제">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<title>숙제 체크리스트</title>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Gaegu:wght@400;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  
  body {
    font-family: 'Gowun Dodum', sans-serif;
    background: #F5EDD7;
    min-height: 100vh;
    padding: 12px 10px 30px;
    padding-top: max(12px, env(safe-area-inset-top));
    padding-bottom: max(30px, env(safe-area-inset-bottom));
    color: #4A2F1B;
    width: 100%;
    max-width: 100vw;
    overflow-x: hidden;
  }
  
  .container { max-width: 380px; margin: 0 auto; width: 100%; }
  
  /* ====== 로그인 화면 ====== */
  .login-screen {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 50vh;
    gap: 10px;
  }
  .login-title {
    font-family: 'Gaegu', cursive;
    font-size: 24px;
    font-weight: 700;
    color: #4A2F1B;
    margin-bottom: 4px;
  }
  .login-sub {
    font-family: 'Gaegu', cursive;
    font-size: 15px;
    color: #7C5A3A;
    margin-bottom: 6px;
  }
  .login-members {
    display: flex;
    gap: 10px;
    flex-wrap: nowrap;
    justify-content: center;
  }
  .login-member-btn {
    background: white;
    border: 2px solid #4A2F1B;
    border-radius: 10px;
    padding: 8px 14px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 3px;
    cursor: pointer;
    box-shadow: 2px 2px 0 #4A2F1B;
    transition: all 0.15s;
    min-width: 68px;
  }
  .login-member-btn:active {
    transform: translate(1px, 1px);
    box-shadow: 1px 1px 0 #4A2F1B;
  }
  .login-member-btn.selected {
    background: #5A8A5E;
    border-color: #2E5A32;
    box-shadow: 2px 2px 0 #2E5A32;
  }
  .login-member-btn.selected .name { color: white; }
  .login-member-btn .emoji { font-size: 22px; }
  .login-member-btn .name {
    font-family: 'Gaegu', cursive;
    font-size: 13px;
    font-weight: 700;
    color: #4A2F1B;
  }
  .login-pin-section {
    display: none;
    flex-direction: column;
    align-items: center;
    gap: 6px;
    margin-top: 6px;
  }
  .login-pin-section.show { display: flex; }
  .login-pin-label {
    font-family: 'Gaegu', cursive;
    font-size: 13px;
    color: #7C5A3A;
  }
  .login-pin-input {
    width: 130px;
    padding: 6px;
    border: 2px solid #4A2F1B;
    border-radius: 8px;
    font-family: 'Gaegu', cursive;
    font-size: 18px;
    text-align: center;
    letter-spacing: 6px;
    outline: none;
    background: white;
    color: #4A2F1B;
  }
  .login-pin-input:focus { border-color: #B88A4A; }
  .login-error {
    color: #B86B6B;
    font-family: 'Gaegu', cursive;
    font-size: 12px;
    min-height: 14px;
  }
  .login-enter-btn {
    background: #B88A4A;
    color: white;
    border: 2px solid #4A2F1B;
    border-radius: 8px;
    padding: 6px 20px;
    font-family: 'Gaegu', cursive;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
    box-shadow: 2px 2px 0 #4A2F1B;
  }
  .login-enter-btn:active {
    transform: translate(2px, 2px);
    box-shadow: 1px 1px 0 #4A2F1B;
  }
  .logout-btn {
    font-family: 'Gaegu', cursive;
    font-size: 13px;
    color: #A8967C;
    background: none;
    border: none;
    cursor: pointer;
    padding: 4px 10px;
  }
  .logout-btn:active { color: #4A2F1B; }

  /* ====== 상단 네비 바 ====== */
  .top-nav {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 12px;
    padding: 6px 4px;
    border-bottom: 1px solid #C8A47C;
  }
  .top-nav-btn {
    font-family: 'Gaegu', cursive;
    font-size: 14px;
    font-weight: 700;
    color: #7C5A3A;
    background: none;
    border: none;
    cursor: pointer;
    padding: 4px 8px;
    display: flex;
    align-items: center;
    gap: 4px;
  }
  .top-nav-btn:active { color: #4A2F1B; }

  /* ====== 프로필 카드 ====== */
  .profile-card {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 14px;
    padding: 4px 0;
  }
  .profile-photo-wrap {
    position: relative;
    width: 64px;
    height: 64px;
    flex-shrink: 0;
  }
  .profile-photo {
    width: 64px;
    height: 64px;
    border-radius: 50%;
    border: 3px solid #4A2F1B;
    object-fit: cover;
    background: #EAE0C2;
    box-shadow: 2px 2px 0 #4A2F1B;
    cursor: pointer;
  }
  .profile-photo-placeholder {
    width: 64px;
    height: 64px;
    border-radius: 50%;
    border: 3px solid #4A2F1B;
    background: #EAE0C2;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 28px;
    box-shadow: 2px 2px 0 #4A2F1B;
    cursor: pointer;
  }
  .profile-photo-edit {
    position: absolute;
    bottom: -2px;
    right: -2px;
    width: 22px;
    height: 22px;
    background: #B88A4A;
    border: 2px solid #4A2F1B;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 11px;
    cursor: pointer;
  }
  .profile-msg {
    flex: 1;
    min-width: 0;
  }
  .profile-msg h1 {
    font-family: 'Gaegu', cursive;
    font-size: 20px;
    font-weight: 700;
    letter-spacing: -1px;
    cursor: pointer;
    padding: 2px 4px;
    border-radius: 6px;
    transition: background 0.2s;
    color: #4A2F1B;
    word-break: break-all;
    line-height: 1.2;
    -webkit-text-stroke: 0.3px #4A2F1B;
  }
  .profile-msg h1:hover { background: rgba(74,47,27,0.08); }

  /* ====== 숙제노트 (접이식) ====== */
  .homework-note-card {
    background: white;
    border: 2px solid #4A2F1B;
    border-radius: 12px;
    margin-bottom: 10px;
    box-shadow: 2px 2px 0 #4A2F1B;
    overflow: hidden;
  }
  .homework-note-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 6px 10px;
    cursor: pointer;
    user-select: none;
    background: #5A8A5E;
  }
  .homework-note-title-wrap {
    display: flex;
    align-items: center;
    gap: 6px;
    flex: 1;
    min-width: 0;
  }
  .homework-note-title {
    font-family: 'Gaegu', cursive;
    font-size: 18px;
    font-weight: 700;
    color: white;
    border: none;
    background: transparent;
    outline: none;
    padding: 2px 4px;
    border-radius: 4px;
    min-width: 0;
    flex: 1;
  }
  .homework-note-title:focus {
    background: rgba(255,255,255,0.2);
  }
  .homework-note-toggle {
    font-size: 16px;
    color: white;
    transition: transform 0.3s;
    flex-shrink: 0;
  }
  .homework-note-toggle.open { transform: rotate(180deg); }
  .homework-note-body {
    max-height: 0;
    overflow: hidden;
    transition: max-height 0.3s ease;
  }
  .homework-note-body.open {
    max-height: 600px;
  }
  .homework-note-content {
    padding: 8px 10px;
    min-height: 40px;
    background: #FFFFFF;
  }
  .note-line {
    display: flex;
    align-items: flex-start;
    gap: 6px;
    padding: 6px 0;
    border-bottom: 1px dashed #D0D0D0;
  }
  .note-line:last-child { border-bottom: none; }
  .note-input {
    flex: 1;
    border: none;
    background: transparent;
    font-family: 'Gowun Dodum', sans-serif;
    font-size: 14px;
    color: #222222;
    outline: none;
    padding: 4px 2px;
    min-width: 0;
    resize: none;
    overflow: hidden;
    line-height: 1.5;
    min-height: 24px;
  }
  .note-input::placeholder { color: #AAAAAA; }
  .note-delete-btn {
    background: none;
    border: none;
    color: #AAAAAA;
    font-size: 18px;
    cursor: pointer;
    padding: 2px 4px;
    line-height: 1;
    opacity: 0.6;
    flex-shrink: 0;
    margin-top: 3px;
  }
  .note-delete-btn:active { opacity: 1; color: #666; }
  .note-add-btn {
    width: 100%;
    padding: 6px;
    background: #FFFFFF;
    border: none;
    border-top: 1px dashed #D0D0D0;
    font-family: 'Gaegu', cursive;
    font-size: 14px;
    font-weight: 700;
    color: #888888;
    cursor: pointer;
  }
  .note-add-btn:active { background: #F5F5F5; }

  /* ====== 숙제노트 팝업 모달 ====== */
  .note-modal-bg {
    position: fixed; inset: 0; background: rgba(74, 47, 27, 0.7);
    display: none; align-items: center; justify-content: center; z-index: 300; padding: 12px;
  }
  .note-modal-bg.show { display: flex; }
  .note-modal {
    background: #FFFFFF; border: 3px solid #4A2F1B; border-radius: 16px;
    width: 100%; max-width: 380px; max-height: 85vh; display: flex; flex-direction: column;
    box-shadow: 6px 6px 0 #4A2F1B; overflow: hidden;
  }
  .note-modal-header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 10px 14px; background: #5A8A5E; flex-shrink: 0;
  }
  .note-modal-title {
    font-family: 'Gaegu', cursive; font-size: 20px; font-weight: 700; color: white;
  }
  .note-modal-close {
    background: none; border: none; color: white; font-size: 22px; cursor: pointer; padding: 2px 6px;
  }
  .note-modal-body {
    flex: 1; overflow-y: auto; padding: 10px 14px; background: #FFFFFF;
  }
  .note-modal-body .note-line {
    display: flex; align-items: flex-start; gap: 6px; padding: 6px 0;
    border-bottom: 1px dashed #D0D0D0;
  }
  .note-modal-body .note-input {
    flex: 1; border: none; background: transparent;
    font-family: 'Gowun Dodum', sans-serif; font-size: 15px; color: #222222;
    outline: none; padding: 4px 2px; min-width: 0;
    resize: none; overflow: hidden; line-height: 1.5; min-height: 26px;
  }
  .note-modal-add {
    width: 100%; padding: 10px; background: #FFFFFF; border: none;
    border-top: 1px dashed #D0D0D0; font-family: 'Gaegu', cursive;
    font-size: 16px; font-weight: 700; color: #888888; cursor: pointer; flex-shrink: 0;
  }
  .note-modal-add:active { background: #F5F5F5; }

  /* ====== 숙제노트 확대 버튼 ====== */
  .homework-note-expand {
    background: none; border: none; color: white; font-size: 16px;
    cursor: pointer; padding: 2px 6px; margin-left: 6px; flex-shrink: 0;
  }

  /* ====== 코인 리셋 버튼 ====== */
  .coin-reset-btn {
    background: #94605E; color: white; border: 2px solid #4A2F1B;
    border-radius: 8px; padding: 3px 8px; font-family: 'Gaegu', cursive;
    font-size: 11px; font-weight: 700; cursor: pointer;
    box-shadow: 2px 2px 0 #4A2F1B; flex-shrink: 0;
    display: none;
  }
  .coin-reset-btn:active { transform: translate(1px,1px); box-shadow: 1px 1px 0 #4A2F1B; }

  /* ====== 헤더 - 프로필 + 타이틀 (레거시 호환) ====== */
  .header { 
    display: none;
  }
  
  .profile-img {
    width: 36px;
    height: 36px;
    border-radius: 50%;
    border: 2px solid #4A2F1B;
    object-fit: cover;
    flex-shrink: 0;
    box-shadow: 1px 1px 0 #4A2F1B;
  }
  .profile-img-placeholder {
    width: 36px;
    height: 36px;
    border-radius: 50%;
    border: 2px solid #4A2F1B;
    background: #EAE0C2;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 18px;
    flex-shrink: 0;
    box-shadow: 1px 1px 0 #4A2F1B;
  }
  
  .header h1 {
    font-family: 'Gaegu', cursive;
    font-size: 22px;
    font-weight: 700;
    letter-spacing: -1.5px;
    cursor: pointer;
    padding: 2px 6px;
    border-radius: 8px;
    transition: background 0.2s;
    color: #4A2F1B;
    white-space: normal;
    overflow: visible;
    flex-shrink: 1;
    flex-grow: 1;
    word-break: break-all;
  }
  
  .header h1:hover { background: rgba(74,47,27,0.08); }
  
  .header-title-input {
    font-family: 'Gaegu', cursive;
    font-size: 22px;
    font-weight: 700;
    letter-spacing: -1.5px;
    border: 2px solid #B88A4A;
    border-radius: 8px;
    padding: 4px 8px;
    background: white;
    outline: none;
    width: 100%;
    color: #4A2F1B;
  }
  
  .top-buttons {
    display: flex;
    flex-direction: column;
    gap: 0;
    background: white;
    border: 2px solid #4A2F1B;
    border-radius: 8px;
    overflow: hidden;
    box-shadow: 2px 2px 0 #4A2F1B;
    flex-shrink: 0;
    align-self: stretch;
  }
  
  .top-buttons button {
    background: white;
    border: none;
    width: 16px;
    flex: 1;
    font-size: 10px;
    cursor: pointer;
    padding: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #4A2F1B;
    font-family: 'Gaegu', cursive;
    font-weight: 700;
  }
  
  .top-buttons button + button {
    border-left: none;
    border-top: 1px solid #4A2F1B;
  }
  
  .top-buttons button:active { background: #EAE0C2; }
  
  .top-bar { display: flex; gap: 6px; margin-bottom: 12px; align-items: stretch; }
  
  .coin-display {
    flex: 1;
    background: linear-gradient(135deg, #5A8A5E, #3D6B40);
    border: 2px solid #2E5A32;
    border-radius: 10px;
    padding: 4px 8px;
    display: flex;
    align-items: center;
    gap: 4px;
    box-shadow: 2px 2px 0 #2E5A32;
  }
  
  .coin-icon { font-size: 20px; animation: spin 4s linear infinite; }
  
  @keyframes spin {
    0%, 90%, 100% { transform: rotateY(0deg); }
    95% { transform: rotateY(360deg); }
  }
  
  .coin-amount { font-family: 'Gaegu', cursive; font-size: 24px; font-weight: 700; color: white; line-height: 1; text-shadow: 1px 1px 2px rgba(0,0,0,0.4); }
  .coin-pending { font-family: 'Gaegu', cursive; font-size: 13px; color: #D4EDDA; font-weight: 700; line-height: 1; white-space: nowrap; }
  .coin-stack { font-size: 18px; margin-left: auto; }
  
  .shop-btn {
    background: #5A8A5E;
    border: 2px solid #4A2F1B;
    border-radius: 12px;
    padding: 4px 14px;
    font-family: 'Gaegu', cursive;
    font-size: 14px;
    font-weight: 700;
    color: white;
    cursor: pointer;
    box-shadow: 2px 2px 0 #4A2F1B;
    line-height: 1.1;
    flex-shrink: 0;
    display: flex;
    flex-direction: row;
    align-items: center;
    justify-content: center;
    gap: 4px;
    min-width: 72px;
  }
  
  .shop-btn:active { transform: translate(2px, 2px); box-shadow: 1px 1px 0 #4A2F1B; }
  
  .calendar-card {
    background: white;
    border: 2px solid #4A2F1B;
    border-radius: 12px;
    padding: 8px;
    margin-bottom: 10px;
    box-shadow: 2px 2px 0 #4A2F1B;
    overflow: hidden;
  }
  
  .cal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
  
  .cal-nav {
    background: #EAE0C2;
    border: 2px solid #4A2F1B;
    border-radius: 6px;
    width: 26px;
    height: 26px;
    font-family: 'Gaegu', cursive;
    font-size: 16px;
    cursor: pointer;
    font-weight: 700;
    color: #4A2F1B;
  }
  
  .cal-title { font-family: 'Gaegu', cursive; font-size: 17px; font-weight: 700; color: #4A2F1B; }
  
  .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; width: 100%; }
  
  .cal-day-name {
    text-align: center;
    font-family: 'Gaegu', cursive;
    font-size: 11px;
    font-weight: 700;
    color: #7C5A3A;
    padding: 1px 0;
  }
  
  .cal-day-name.sun { color: #B86B6B; }
  .cal-day-name.sat { color: #6B89B8; }
  
  .cal-cell {
    aspect-ratio: 1;
    border-radius: 12px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    font-family: 'Gaegu', cursive;
    font-size: 14px;
    font-weight: 700;
    background: #EAE0C2;
    -webkit-text-stroke: 0.2px currentColor;
    border: 2px solid transparent;
    position: relative;
    transition: all 0.15s;
    padding-top: 1px;
    padding-bottom: 2px;
    min-width: 0;
    box-sizing: border-box;
    overflow: hidden;
    color: #4A2F1B;
  }
  
  .cal-cell.sun { color: #B86B6B; }
  .cal-cell.sat { color: #6B89B8; }
  
  .cal-cell:active { transform: scale(0.95); }
  .cal-cell.empty { background: transparent; cursor: default; }
  
  .cal-cell.today { border-color: #1E88E5; background: #1E88E5; color: #FFFFFF !important; }
  .cal-cell.today .day-num { color: #FFFFFF; }
  .cal-cell.selected { background: #4A2F1B; color: #F5EDD7; border-color: #4A2F1B; }
  
  .cell-gauge {
    position: absolute; left: 0; right: 0; bottom: 0;
    overflow: hidden; transition: height 0.4s ease;
    pointer-events: none; z-index: 1;
  }
  .cell-gauge-inner {
    position: absolute; left: 0; right: 0; bottom: 0;
    width: 100%; aspect-ratio: 1 / 1;
    background: linear-gradient(to top, #E53935 0%, #FB8C00 25%, #FDD835 50%, #43A047 75%, #1E88E5 100%);
  }
  .cell-gauge-lines {
    position: absolute; left: 0; right: 0; top: 0; bottom: 0;
    pointer-events: none; z-index: 2; border-radius: 10px;
  }
  .cal-cell .day-num { position: relative; z-index: 3; }
  .cal-cell.has-gauge { background: #2A1F14; }
  .cal-cell.has-gauge .day-num { color: rgba(255,255,255,0.65); }
  .cal-cell.has-gauge.selected .day-num { color: rgba(255,255,255,0.65); }
  .cal-cell.all-confirmed { background: #5A8A5E; color: #FFF4D6; }
  .cal-cell.all-confirmed.sun, .cal-cell.all-confirmed.sat { color: #FFF4D6; }
  .cal-cell.all-confirmed .cell-gauge { display: none; }
  .cal-cell.selected.all-confirmed { background: #4A2F1B; }
  .cal-cell.selected.sun, .cal-cell.selected.sat { color: #F5EDD7; }
  
  .selected-date {
    text-align: center; margin-bottom: 8px;
    font-family: 'Gaegu', cursive; font-size: 19px; font-weight: 700; color: #4A2F1B;
    -webkit-text-stroke: 0.2px #4A2F1B;
  }
  
  .subject {
    background: white; border: 2px solid #4A2F1B; border-radius: 12px;
    margin-bottom: 8px; overflow: hidden; box-shadow: 2px 2px 0 #4A2F1B;
  }
  .subject-header {
    padding: 5px 8px; display: flex; align-items: center; gap: 6px;
    border-bottom: 1px dashed #C8A47C;
    cursor: pointer; user-select: none;
  }
  .subject-toggle {
    font-size: 12px; color: #4A2F1B; transition: transform 0.3s; flex-shrink: 0;
    padding: 4px;
  }
  .subject-toggle.collapsed { transform: rotate(-90deg); }
  .subject-body {
    overflow: hidden; transition: max-height 0.3s ease;
  }
  .subject-body.collapsed {
    max-height: 0 !important;
    overflow: hidden;
  }
  .subject-name-input {
    flex: 1; font-family: 'Gaegu', cursive; font-size: 18px; font-weight: 700;
    border: none; background: transparent; outline: none; padding: 2px 4px;
    border-radius: 6px; color: #4A2F1B; min-width: 0;
    -webkit-text-stroke: 0.3px #4A2F1B;
  }
  .subject-name-input:focus { background: rgba(255,255,255,0.7); }
  .subject-status { font-size: 14px; color: #7C2D12; font-weight: 700; font-family: 'Gaegu', cursive; }

  .owned-tickets { background: #FFFFFF; border: 1.5px dashed #5A8A5E; border-radius: 6px; padding: 6px 8px; margin-bottom: 8px; }

  .pwd-input {

  }

  }

  .modal-btn.danger { background: #94605E; color: white; }

  .chat-panel {

<div class="loading-overlay" id="loadingOverlay">불러오는 중...</div>

      <button class="top-nav-btn" onclick="closeApp()">닫기 ✕</button>
    </div>
    
    <!-- 프로필 카드 -->
    <div class="profile-card">

        <div class="profile-photo-placeholder" id="profilePhotoPlaceholder" onclick="document.getElementById('profileFileInput').click();">📷</div>
        <div class="profile-photo-edit" onclick="document.getElementById('profileFileInput').click();">✏️</div>

let audioCtx = null;
let soundOn = true;

function initAudio() {
  if (!audioCtx) {
    try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e) {}
  }
  if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
}
function playTone(freq, duration, type = 'sine', volume = 0.15) {
  if (!soundOn) return; initAudio(); if (!audioCtx) return;
  const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain();
  osc.type = type; osc.frequency.value = freq;
  gain.gain.setValueAtTime(volume, audioCtx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
  osc.connect(gain); gain.connect(audioCtx.destination);
  osc.start(); osc.stop(audioCtx.currentTime + duration);
}
function soundCheck() { playTone(1200, 0.15, 'sine', 0.2); setTimeout(() => playTone(1600, 0.2, 'sine', 0.15), 80); }
function soundCoin() { playTone(800, 0.08, 'square', 0.1); setTimeout(() => playTone(1200, 0.1, 'square', 0.1), 60); setTimeout(() => playTone(1600, 0.15, 'square', 0.08), 120); }
function soundFanfare() { [523, 659, 784, 1047].forEach((f, i) => setTimeout(() => playTone(f, 0.2, 'triangle', 0.18), i * 100)); }
function soundBonus() { [523, 659, 784, 880, 1047].forEach((f, i) => setTimeout(() => playTone(f, 0.15, 'sine', 0.15), i * 80)); }

/* ====== 데이터 로드 ====== */
async function loadAllData() {
  const [subRes, taskRes, coinRes, confRes, shopRes, tickRes, settRes] = await Promise.all([
    sb.from('subjects').select('*').order('sort_order'),
    sb.from('tasks').select('*').order('sort_order'),
    sb.from('coins').select('*').eq('member_id', 'elliot').single(),
    sb.from('confirmations').select('*'),
    sb.from('shop_items').select('*'),
    sb.from('tickets').select('*'),
    sb.from('app_settings').select('*')
  ]);
  
  cachedSubjects = subRes.data || [];
  cachedTasks = taskRes.data || [];
  if (coinRes.data) cachedCoins = { amount: coinRes.data.amount, pending: coinRes.data.pending || {} };
  cachedConfirmations = {};
  (confRes.data || []).forEach(c => { cachedConfirmations[c.date_key] = c; });
  cachedShopItems = shopRes.data || [];
  cachedTickets = {};
  (tickRes.data || []).forEach(t => { cachedTickets[t.item_id] = t.count; });
  
  const settings = {};
  (settRes.data || []).forEach(s => { settings[s.key] = s.value; });
  if (settings.app_title) {
    document.getElementById('appTitle').textContent = settings.app_title;
  }
}

function getSubjectsForDate(dk) {
  return cachedSubjects.filter(s => s.date_key === dk);
}
function getTasksForSubject(dk, subjectId) {
  return cachedTasks.filter(t => t.date_key === dk && t.subject_id === subjectId).sort((a,b) => a.sort_order - b.sort_order);
}
function getDayStats(dk) {
  const subs = getSubjectsForDate(dk);
  let done = 0, total = 0;
  subs.forEach(s => {
    const tasks = getTasksForSubject(dk, s.id);
    total += tasks.length;
    done += tasks.filter(t => t.done).length;
  });
  return { done, total };
}
function hasRealTask(dk) {
  const subs = getSubjectsForDate(dk);
  return subs.some(s => getTasksForSubject(dk, s.id).length > 0);
}

/* ====== 실시간 구독 ====== */
function setupRealtime() {
  sb.channel('app-changes')
    .on('postgres_changes', { event: '*', schema: 'public', table: 'subjects' }, () => refreshData())
    .on('postgres_changes', { event: '*', schema: 'public', table: 'tasks' }, () => refreshData())
    .on('postgres_changes', { event: '*', schema: 'public', table: 'confirmations' }, () => refreshData())
    .on('postgres_changes', { event: '*', schema: 'public', table: 'coins' }, () => refreshData())
    .on('postgres_changes', { event: '*', schema: 'public', table: 'shop_items' }, () => refreshData())
    .on('postgres_changes', { event: '*', schema: 'public', table: 'tickets' }, () => refreshData())
    .subscribe();

  sb.channel('chat-channel')
    .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'chat_messages' }, payload => {
      onNewChatMessage(payload.new);
    })
    .subscribe();
}

function refreshData() {

function renderCalendar() {
  const monthNames = ['1월','2월','3월','4월','5월','6월','7월','8월','9월','10월','11월','12월'];
  document.getElementById('calTitle').textContent = `${viewYear}년 ${monthNames[viewMonth]}`;
  
  const grid = document.getElementById('calGrid');
  grid.innerHTML = '';
  
  const dayNames = ['일','월','화','수','목','금','토'];
  dayNames.forEach((n, i) => {
    const el = document.createElement('div');
    el.className = 'cal-day-name';
    if (i === 0) el.classList.add('sun');
    if (i === 6) el.classList.add('sat');
    el.textContent = n;
    grid.appendChild(el);
  });
  
  const firstDay = new Date(viewYear, viewMonth, 1).getDay();
  const lastDate = new Date(viewYear, viewMonth + 1, 0).getDate();
  const today = todayKey();
  
  for (let i = 0; i < firstDay; i++) {
    const el = document.createElement('div');
    el.className = 'cal-cell empty';
    grid.appendChild(el);
  }
  
  for (let d = 1; d <= lastDate; d++) {
    const key = dateKey(viewYear, viewMonth, d);
    const cell = document.createElement('div');
    cell.className = 'cal-cell';
    
    const dow = new Date(viewYear, viewMonth, d).getDay();
    if (dow === 0) cell.classList.add('sun');
    if (dow === 6) cell.classList.add('sat');
    if (key === today) cell.classList.add('today');
    if (key === selectedDate) cell.classList.add('selected');
    
    const stats = getDayStats(key);
    const hasReal = hasRealTask(key);
    
    let html = `<span class="day-num">${d}</span>`;
    
    if (hasReal && stats.total > 0) {
      const allDone = stats.done === stats.total;
      const confirmed = cachedConfirmations[key];
      
      if (allDone && confirmed) {
        cell.classList.add('all-confirmed');
      } else {
        const pct = Math.round((stats.done / stats.total) * 100);
        if (pct > 0) {
          cell.classList.add('has-gauge');
          const radius = pct >= 100 ? '10px' : '0 0 10px 10px';
          html += `<div class="cell-gauge" style="height:${pct}%;border-radius:${radius};"><div class="cell-gauge-inner"></div></div>`;
          if (stats.total > 1) {
            const lines = [];
            for (let i = 1; i < stats.total; i++) {
              const lp = (i / stats.total) * 100;
              lines.push(`linear-gradient(to bottom, transparent calc(${lp}% - 2px), rgba(0,0,0,0.85) ${lp}%, transparent calc(${lp}% + 2px))`);
            }
            html += `<div class="cell-gauge-lines" style="background-image:${lines.join(',')}"></div>`;
          }
        }
      }
    }
    
    cell.innerHTML = html;
    cell.onclick = () => { soundClick(); selectedDate = key; renderAll(); };
    grid.appendChild(cell);
  }
}

function changeMonth(delta) {

}

function renderTasks() {

  const days = ['일','월','화','수','목','금','토'];
  document.getElementById('selectedDate').textContent = `${m}월 ${d}일 (${days[dt.getDay()]})`;
  
  const container = document.getElementById('subjects');
  container.innerHTML = '';
  
  const subs = getSubjectsForDate(dk);
  
  if (subs.length === 0) {
    container.innerHTML = '';
    return;
  }
  
  subs.forEach(s => {
    const tasks = getTasksForSubject(dk, s.id);
    const done = tasks.filter(t => t.done).length;
    
    const sEl = document.createElement('div');
    sEl.className = 'subject';
    
    // 삭제 버튼은 부모만 보이게
    const deleteBtn = isParent() 
      ? `<button class="subject-delete-btn" title="과목 삭제" onclick="event.stopPropagation();">−</button>` 
      : '';
    
    sEl.innerHTML = `
      <div class="subject-header" style="background:${s.color || '#EAE0C2'};" onclick="toggleSubject('${s.id}')">
        <span class="subject-toggle ${collapsedSubjects[s.id] ? 'collapsed' : ''}" id="subject-toggle-${s.id}">▼</span>
        <input type="text" class="subject-name-input" value="${esc(s.name)}" maxlength="20" onfocus="this.select()" onclick="event.stopPropagation();">
        <span class="subject-status">${done}/${tasks.length}</span>
        ${deleteBtn}
      </div>
      <div class="subject-body ${collapsedSubjects[s.id] ? 'collapsed' : ''}" id="subject-body-${s.id}">
        <div class="task-list" id="list-${s.id}"></div>
        <button class="add-btn">+ 숙제 추가</button>
      </div>
    `;
    container.appendChild(sEl);
    
    sEl.querySelector('.subject-name-input').addEventListener('change', e => updateSubjectName(s.id, e.target.value));
    if (isParent()) {
      const delBtn = sEl.querySelector('.subject-delete-btn');
      if (delBtn) delBtn.addEventListener('click', () => openDeleteSubject(s.id));
    }
    sEl.querySelector('.add-btn').addEventListener('click', () => addTask(s.id, dk));
    
    const list = sEl.querySelector(`#list-${s.id}`);
    tasks.forEach((task, idx) => {
      const tEl = document.createElement('div');
      tEl.className = 'task' + (task.done ? ' done' : '');
      
      // 삭제 버튼은 부모만
      const taskDel = isParent() 
        ? `<button class="delete-btn" title="삭제">−</button>` 
        : '';
      
      tEl.innerHTML = `
        <div class="checkbox"></div>
        <input type="text" class="task-input" value="${esc(task.text)}" onfocus="this.select()">
        ${taskDel}
      `;
      tEl.querySelector('.checkbox').addEventListener('click', () => toggleTask(task));
      tEl.querySelector('.task-input').addEventListener('change', e => updateTaskText(task.id, e.target.value));
      if (isParent()) {
        const db = tEl.querySelector('.delete-btn');
        if (db) db.addEventListener('click', () => deleteTask(task.id, dk));
      }
      list.appendChild(tEl);
    });
  });
}

async function addTask(subjectId, dk) {
  soundClick();
  const { error } = await sb.from('tasks').insert({
    subject_id: subjectId, date_key: dk, text: '새 숙제', done: false, sort_order: Date.now() % 2000000000
  });
  if (!error) {
    showToast('✏️ 숙제가 추가됐어요');
    // 확인 취소
    await sb.from('confirmations').delete().eq('date_key', dk);
    await refreshData();
  }
}

async function toggleTask(task) {
  const newDone = !task.done;
  await sb.from('tasks').update({ done: newDone }).eq('id', task.id);
  
  if (newDone) {
    soundCheck();
    setTimeout(() => soundCoin(), 200);
    // 예비 코인 추가
    const pending = { ...(cachedCoins.pending || {}) };
    pending[task.date_key] = (pending[task.date_key] || 0) + 1;
    await sb.from('coins').update({ pending }).eq('member_id', 'elliot');
    showDogMsg('+1 💰', 1500);
  } else {
    soundClick();
    // 코인 회수
    const confirmed = cachedConfirmations[task.date_key];
    if (confirmed) {
      await sb.from('coins').update({ amount: Math.max(0, cachedCoins.amount - 1) }).eq('member_id', 'elliot');
      await sb.from('confirmations').delete().eq('date_key', task.date_key);
      showDogMsg('확인 취소', 1500);
    } else {
      const pending = { ...(cachedCoins.pending || {}) };
      pending[task.date_key] = Math.max(0, (pending[task.date_key] || 0) - 1);
      await sb.from('coins').update({ pending }).eq('member_id', 'elliot');
      showDogMsg('-1 💰', 1500);
    }
  }
  
  await refreshData();
}

async function updateTaskText(taskId, text) {
  await sb.from('tasks').update({ text }).eq('id', taskId);
}

async function deleteTask(taskId, dk) {
  if (!isParent()) { showToast('부모만 삭제할 수 있어요'); return; }
  soundClick();
  if (!confirm('이 숙제를 지울까요?')) return;
  await sb.from('tasks').delete().eq('id', taskId);
  await sb.from('confirmations').delete().eq('date_key', dk);
  showToast('🗑️ 숙제가 삭제됐어요');
  await refreshData();
}

async function doConfirm() {
  if (!isParent()) return;
  
  const pending = cachedCoins.pending[selectedDate] || 0;
  const newAmount = cachedCoins.amount + pending;
  const newPending = { ...(cachedCoins.pending || {}) };
  delete newPending[selectedDate];
  
  await Promise.all([
    sb.from('confirmations').upsert({ date_key: selectedDate, confirmed_by: currentUser.id }),
    sb.from('coins').update({ amount: newAmount, pending: newPending }).eq('member_id', 'elliot')
  ]);
  
  soundFanfare();
  if (pending > 0) showDogMsg(`💕 +${pending} 💰`, 1800);
  else showDogMsg('💕 참 잘했어요', 1500);
  
  await refreshData();
}

function editAppTitle() {
  if (!isParent()) return;
  const h1 = document.getElementById('appTitle');
  const cur = h1.textContent;
  const input = document.createElement('input');
  input.type = 'text'; input.className = 'header-title-input';
  input.value = cur; input.maxLength = 30;
  
  h1.replaceWith(input); input.focus(); input.select();
  input.addEventListener('input', () => { if (input.value.length > 30) input.value = input.value.slice(0, 30); });
  
  const finish = async () => {
    let val = input.value.trim();
    if (val.length > 30) val = val.slice(0, 30);
    if (!val) val = '숙제 체크리스트';
    await sb.from('app_settings').upsert({ key: 'app_title', value: val });
    const newH1 = document.createElement('h1');
    newH1.id = 'appTitle'; newH1.textContent = val; newH1.onclick = editAppTitle;
    input.replaceWith(newH1);
  };
  
  input.addEventListener('blur', finish);
  input.addEventListener('keydown', e => {
    if (e.key === 'Enter') input.blur();
    if (e.key === 'Escape') { input.value = cur; input.blur(); }
  });
}

      <div class="shop-item-price">${item.price} 💰</div>
      <div class="shop-item-actions">
        <button class="buy-btn" ${cachedCoins.amount < item.price ? 'disabled' : ''}>구매</button>
        ${delBtn}
      </div>
    `;
    el.querySelector('.shop-item-name').textContent = item.name;
    el.querySelector('.buy-btn').addEventListener('click', () => buyItem(item));
    if (isParent()) {
      const db = el.querySelector('.shop-item-delete');
      if (db) db.addEventListener('click', () => deleteShopItem(item.id));
    }
    grid.appendChild(el);
  });
}

function renderOwned() {
  const el = document.getElementById('ownedList');
  const items = [];
  cachedShopItems.forEach(item => {
    const cnt = cachedTickets[item.id] || 0;
    if (cnt > 0) items.push(`${item.icon || '🎁'} ${item.name} ${cnt}장`);
  });
  el.innerHTML = items.length === 0 
    ? '<span class="owned-empty">아직 없어요</span>' 
    : items.join(' · ');
}

async function renderPurchaseHistory() {
  const { data } = await sb.from('purchase_history')
    .select('*')
    .order('created_at', { ascending: false })
    .limit(10);
  const el = document.getElementById('purchaseHistoryList');
  if (!data || data.length === 0) {
    el.innerHTML = '<span class="owned-empty">아직 없어요</span>';
    return;
  }
  el.innerHTML = data.map(p => {
    const d = new Date(p.created_at);
    const ds = `${d.getMonth()+1}/${d.getDate()} ${d.getHours()}:${String(d.getMinutes()).padStart(2,'0')}`;
    return `<div style="font-size:12px;margin-bottom:2px;">${p.item_icon} ${esc(p.item_name)} (${p.price}💰) - ${ds}</div>`;
  }).join('');
}

async function buyItem(item) {
  if (cachedCoins.amount < item.price) return;
  if (!confirm(`${item.icon || '🎁'} ${item.name} 을(를) 구매할까요? (${item.price} 💰)`)) return;
  
  const newAmount = cachedCoins.amount - item.price;
  const newCount = (cachedTickets[item.id] || 0) + 1;
  
  await Promise.all([
    sb.from('coins').update({ amount: newAmount }).eq('member_id', 'elliot'),
    sb.from('tickets').upsert({ item_id: item.id, member_id: 'elliot', count: newCount }),
    sb.from('purchase_history').insert({ member_id: currentUser.id, item_name: item.name, item_icon: item.icon || '🎁', price: item.price })
  ]);
  
  // 채팅으로 요청 메시지 자동 전송
  const reqMsg = `${item.icon || '🎁'} ${item.name} 이용권을 사용하고 싶어요!`;
  await sb.from('chat_messages').insert({
    sender_id: currentUser.id,
    sender_name: currentUser.name,
    message: reqMsg
  });
  
  soundFanfare();
  showToast(`🎉 ${item.icon || '🎁'} ${item.name} 구매 완료!`);
  await refreshData();
  renderShopItems();
  renderOwned();
  renderPurchaseHistory();
}

async function deleteShopItem(id) {
  if (!isParent()) return;
  soundClick();
  if (!confirm('이 상품을 지울까요?')) return;
  await sb.from('shop_items').delete().eq('id', id);
  await refreshData();
  renderShopItems();
  renderOwned();
  showToast('🗑️ 상품이 삭제됐어요');
}

function openAddShopItem() {
  if (!isParent()) return;
  soundClick();
  document.getElementById('newShopItemName').value = '';
  document.getElementById('newShopItemPrice').value = '';
  document.getElementById('addShopItemError').textContent = '';
  document.getElementById('addShopItemModal').classList.add('show');
  setTimeout(() => document.getElementById('newShopItemName').focus(), 100);
}
function closeAddShopItem() { document.getElementById('addShopItemModal').classList.remove('show'); }

function guessIcon(name) {
  const map = {
    '치킨': '🍗', '삼겹살': '🥩', 'pc방': '🎮', 'PC방': '🎮', '피시방': '🎮',
    '용돈': '💵', '아이스크림': '🍦', '피자': '🍕', '햄버거': '🍔', '라면': '🍜',
    '떡볶이': '🌶️', '영화': '🎬', '게임': '🕹️', '장난감': '🧸', '과자': '🍪',
    '초콜릿': '🍫', '케이크': '🎂', '빵': '🍞', '족발': '🦶', '커피': '☕',
    '음료': '🥤', '스티커': '⭐', '간식': '🍿', '놀이공원': '🎡', '수영': '🏊'
  };
  for (const [key, icon] of Object.entries(map)) {
    if (name.toLowerCase().includes(key.toLowerCase())) return icon;
  }
  return '🎁';
}

async function addShopItem() {
  const name = document.getElementById('newShopItemName').value.trim();
  const priceStr = document.getElementById('newShopItemPrice').value.trim();
  const err = document.getElementById('addShopItemError');
  
  if (!name) { err.textContent = '상품 이름을 입력하세요'; soundError(); return; }
  const price = parseInt(priceStr);
  if (isNaN(price) || price < 1) { err.textContent = '가격을 올바로 입력하세요'; soundError(); return; }
  
  const id = 'item_' + Date.now().toString(36) + Math.random().toString(36).slice(2, 5);
  const icon = guessIcon(name);
  await sb.from('shop_items').insert({ id, name, icon, price });
  
  // 데이터 먼저 새로고침
  const { data: freshItems } = await sb.from('shop_items').select('*');
  cachedShopItems = freshItems || [];
  
  soundFanfare();
  closeAddShopItem();
  renderShopItems();
  renderOwned();
  showToast(`✨ "${name}" 추가됨`);
}

/* ====== 채팅 ====== */
async function loadChat() {
  const { data } = await sb.from('chat_messages')
    .select('*')
    .order('created_at', { ascending: false })
    .limit(50);
  
  chatMessages = (data || []).reverse();
  if (chatMessages.length > 0) {
    lastSeenChatId = chatMessages[chatMessages.length - 1].id;
  }
  renderChatMessages();
}

function onNewChatMessage(msg) {
  chatMessages.push(msg);
  if (chatMessages.length > 100) chatMessages = chatMessages.slice(-50);
  
  if (!chatOpen) {
    updateChatBadge();
  } else {
    lastSeenChatId = msg.id;
  }
  renderChatMessages();
}

function updateChatBadge() {
  const unseen = chatMessages.filter(m => m.id > lastSeenChatId && m.sender_id !== currentUser.id).length;
  const badge = document.getElementById('chatBadge');
  if (unseen > 0) {
    badge.textContent = unseen > 9 ? '9+' : unseen;
    badge.classList.add('show');
  } else {
    badge.classList.remove('show');
  }
}

function toggleChat() {
  chatOpen = !chatOpen;
  document.getElementById('chatPanel').classList.toggle('open', chatOpen);
  if (chatOpen) {
    if (chatMessages.length > 0) lastSeenChatId = chatMessages[chatMessages.length - 1].id;
    document.getElementById('chatBadge').classList.remove('show');
    renderChatMessages();
    setTimeout(() => {
      const el = document.getElementById('chatMessages');
      el.scrollTop = el.scrollHeight;
      document.getElementById('chatInput').focus();
    }, 350);
  }
}

function renderChatMessages() {
  const container = document.getElementById('chatMessages');
  container.innerHTML = '';
  
  chatMessages.forEach(msg => {
    const isMine = msg.sender_id === currentUser.id;
    const div = document.createElement('div');
    div.className = 'chat-msg ' + (isMine ? 'mine' : 'other');
    
    const time = new Date(msg.created_at);
    const timeStr = `${time.getHours()}:${String(time.getMinutes()).padStart(2,'0')}`;
    
    div.innerHTML = `
      ${!isMine ? `<div class="msg-sender">${esc(msg.sender_name)}</div>` : ''}
      <div>${esc(msg.message)}</div>
      <div class="msg-time">${timeStr}</div>
    `;
    container.appendChild(div);
  });
  
  container.scrollTop = container.scrollHeight;
}

async function sendChat() {
  const input = document.getElementById('chatInput');
  const text = input.value.trim();
  if (!text) return;
  
  input.value = '';
  
  await sb.from('chat_messages').insert({
    sender_id: currentUser.id,
    sender_name: currentUser.name,
    message: text
  });
}

document.getElementById('chatInput').addEventListener('keypress', e => {
  if (e.key === 'Enter') sendChat();
});

/* ====== 키보드 이벤트 ====== */
document.addEventListener('DOMContentLoaded', () => {
  document.getElementById('newSubjectInput').addEventListener('keypress', e => { if (e.key === 'Enter') addSubject(); });
  document.getElementById('deleteSubjectPwd').addEventListener('keypress', e => { if (e.key === 'Enter') confirmDeleteSubject(); });
});

document.addEventListener('touchstart', initAudio, { once: true });
document.addEventListener('click', initAudio, { once: true });

/* ====== 키보드 대응 (채팅) ====== */
if (window.visualViewport) {
  window.visualViewport.addEventListener('resize', () => {
    const panel = document.getElementById('chatPanel');
    if (panel.classList.contains('open')) {
      const vvh = window.visualViewport.height;
      const offset = window.innerHeight - vvh;
      panel.style.height = vvh + 'px';
      panel.style.top = window.visualViewport.offsetTop + 'px';
      // 스크롤 맨 아래로
      setTimeout(() => {
        const msgs = document.getElementById('chatMessages');
        msgs.scrollTop = msgs.scrollHeight;
      }, 50);
    }
  });
  window.visualViewport.addEventListener('scroll', () => {
    const panel = document.getElementById('chatPanel');
    if (panel.classList.contains('open')) {
      panel.style.top = window.visualViewport.offsetTop + 'px';
    }
  });
}

/* ====== 시작 ====== */
initApp();
</script>
