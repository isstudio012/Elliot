function playTone(freq, duration, type = 'sine', volume = 0.15) {
  if (!soundOn) return; initAudio(); if (!audioCtx) return;
  const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain();
  osc.type = type; osc.frequency.value = freq;
  gain.gain.setValueAtTime(volume, audioCtx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
  osc.connect(gain); gain.connect(audioCtx.destination);
  osc.start(); osc.stop(audioCtx.currentTime + duration);
}

function playBallBounce(vol) {
  try {
    const ac = getLoginAC();
    const buf = ac.createBuffer(1, ac.sampleRate * 0.06, ac.sampleRate);
    const data = buf.getChannelData(0);
    for (let i = 0; i < data.length; i++) data[i] = (Math.random()*2-1) * Math.exp(-i/(data.length*0.3));
    const src = ac.createBufferSource();
    src.buffer = buf;
    const gain = ac.createGain();
    gain.gain.value = vol || 0.3;
    const filter = ac.createBiquadFilter();
    filter.type = 'bandpass'; filter.frequency.value = 180; filter.Q.value = 0.8;
    src.connect(filter); filter.connect(gain); gain.connect(ac.destination);
    src.start(ac.currentTime);
  } catch(e) {}
}

      if (inBotGoalX) {
        if (ball.y + d > H) {
          // ?룸꼍 - 怨듭씠 ?덈컲 ?댁긽 ?ㅼ뼱媛??怨?          if (ball.y + d - ball.r >= H + goalDepthPx + 10) {
            triggerGoal('bottom', ball, W, H); return;
          }
          // 怨⑤? ??醫뚯슦 湲곕뫁 異⑸룎
          if (cx <= goalLeft + ball.r) {
            ball.x = goalLeft - ball.r; ball.vx = Math.abs(ball.vx) * RESTITUTION; playBallBounce(0.7);
          }
          if (cx >= goalRight - ball.r) {
            ball.x = goalRight - ball.r; ball.vx = -Math.abs(ball.vx) * RESTITUTION; playBallBounce(0.7);
          }
        }
      } else {
        if (ball.y + d > H) { ball.y = H - d; ball.vy = -Math.abs(ball.vy) * RESTITUTION; if(Math.abs(ball.vy)>1) playBallBounce(0.5); }
        if (ball.y + d > H - goalDepthPx * 2) {
          if (cx > goalLeft - ball.r && cx < goalLeft + ball.r) {
            ball.x = goalLeft - d; ball.vx = -Math.abs(ball.vx) * RESTITUTION; playBallBounce(0.7);
          }
          if (cx > goalRight - ball.r && cx < goalRight + ball.r) {
            ball.x = goalRight; ball.vx = Math.abs(ball.vx) * RESTITUTION; playBallBounce(0.7);
          }
        }
      }

      ball.btn.style.left = ball.x + 'px';
      ball.btn.style.top  = ball.y + 'px';
    });

    // ?먯닔 ?レ옄 異⑸룎 (怨⑦궎????븷)
    const scoreR = 22; // 異⑸룎 諛섍꼍(px)
    const scoreObstacles = [
      { x: W/2, y: 28 },        // ?곷떒 ?먯닔
      { x: W/2, y: H - 28 }     // ?섎떒 ?먯닔
    ];
    loginBalls.forEach(ball => {
      if (ball.dragging) return;
      const cx = ball.x + ball.r, cy = ball.y + ball.r;
      scoreObstacles.forEach(obs => {
        const dx = cx - obs.x, dy = cy - obs.y;
        const dist = Math.sqrt(dx*dx + dy*dy);
        const minD = ball.r + scoreR;
        if (dist < minD && dist > 0.01) {
          const nx = dx/dist, ny = dy/dist;
          const overlap = minD - dist;
          ball.x += nx * overlap; ball.y += ny * overlap;
          const dot = ball.vx*nx + ball.vy*ny;
          if (dot < 0) {
            ball.vx -= 2 * dot * nx * RESTITUTION;
            ball.vy -= 2 * dot * ny * RESTITUTION;
            playBallBounce(0.6);
          }
        }
      });
    });
    for (let i = 0; i < loginBalls.length; i++) {
      for (let j = i+1; j < loginBalls.length; j++) {
        const a = loginBalls[i], b = loginBalls[j];
        const ax = a.x + a.r, ay = a.y + a.r;
        const bx = b.x + b.r, by = b.y + b.r;
        const dx = bx - ax, dy = by - ay;
        const dist = Math.sqrt(dx*dx + dy*dy);
        const minD = a.r + b.r;
        if (dist < minD && dist > 0.01) {
          const nx = dx/dist, ny = dy/dist;
          const overlap = minD - dist;
          a.x -= nx * overlap/2; a.y -= ny * overlap/2;
          b.x += nx * overlap/2; b.y += ny * overlap/2;
          const dvx = a.vx - b.vx, dvy = a.vy - b.vy;
          const dot = dvx*nx + dvy*ny;
          if (dot > 0) {
            const imp = dot * RESTITUTION;
            a.vx -= imp * nx; a.vy -= imp * ny;
            b.vx += imp * nx; b.vy += imp * ny;
            if (imp > 1) playBallBounce(0.4);
          }
        }
      }
    }
  }
  loginPhysicsRAF = requestAnimationFrame(step);
}

function makeLoginBallDraggable(btn, ball) {
  let startX, startY, startBallX, startBallY;
  let lastX, lastY, lastTime;

  btn.addEventListener('pointerdown', e => {
    ball.dragging = true;
    ball.dragged = false;
    startX = e.clientX; startY = e.clientY;
    startBallX = ball.x; startBallY = ball.y;
    lastX = e.clientX; lastY = e.clientY; lastTime = Date.now();
    ball.vx = 0; ball.vy = 0;
    btn.style.transition = 'none';
    btn.classList.add('dragging');
    btn.setPointerCapture(e.pointerId);
    playBallPickup();
    e.stopPropagation();
  });

  btn.addEventListener('pointermove', e => {
    if (!ball.dragging) return;
    const dx = e.clientX - startX;
    const dy = e.clientY - startY;
    if (Math.abs(dx)+Math.abs(dy) > 4) ball.dragged = true;
    const now = Date.now();
    const dt = Math.max(1, now - lastTime);
    ball.vx = (e.clientX - lastX) / dt * 14;
    ball.vy = (e.clientY - lastY) / dt * 14;
    lastX = e.clientX; lastY = e.clientY; lastTime = now;
    const container = btn.parentElement;
    const W = container.clientWidth, H = container.clientHeight;
    ball.x = Math.min(Math.max(-ball.r*0.5, startBallX + dx), W - ball.r*1.5);
    ball.y = Math.min(Math.max(0, startBallY + dy), H - ball.r*2);
    btn.style.left = ball.x + 'px';
    btn.style.top = ball.y + 'px';
    e.stopPropagation();
  });

  const stopDrag = e => {
    if (!ball.dragging) return;
    ball.dragging = false;
    btn.classList.remove('dragging');
    try { btn.releasePointerCapture(e.pointerId); } catch(err) {}
    setTimeout(() => { ball.dragged = false; }, 0);
  };
  btn.addEventListener('pointerup', stopDrag);
  btn.addEventListener('pointercancel', stopDrag);
}

function getSubjectsForDate(dk) {
  return cachedSubjects.filter(s => s.date_key === dk);
}
function getTasksForSubject(dk, subjectId) {
  return cachedTasks.filter(t => t.date_key === dk && t.subject_id === subjectId).sort((a,b) => a.sort_order - b.sort_order);
}
function getDayStats(dk) {
  const subs = getSubjectsForDate(dk);
  let done = 0, total = 0;
  subs.forEach(s => {
    const tasks = getTasksForSubject(dk, s.id);
    total += tasks.length;
    done += tasks.filter(t => t.done).length;
  });
  return { done, total };
}
function hasRealTask(dk) {
  const subs = getSubjectsForDate(dk);
  return subs.some(s => getTasksForSubject(dk, s.id).length > 0);
}

// 怨쇰ぉ ?좏깮 紐⑤떖 ?쒕옒洹?(function() {
  let dragging = false, offX = 0, offY = 0;
  
  function onStart(cx, cy) {
    const modal = document.getElementById('subjectModalInner');
    if (!modal) return;
    dragging = true;
    const rect = modal.getBoundingClientRect();
    offX = cx - rect.left;
    offY = cy - rect.top;
    modal.style.transform = 'none';
    modal.style.transition = 'none';
  }
  function onMove(cx, cy) {
    if (!dragging) return;
    const modal = document.getElementById('subjectModalInner');
    modal.style.left = (cx - offX) + 'px';
    modal.style.top = (cy - offY) + 'px';
  }
  function onEnd() { dragging = false; }
  
  document.addEventListener('DOMContentLoaded', () => {
    const handle = document.getElementById('subjectModalDragHandle');
    if (!handle) return;
    handle.addEventListener('touchstart', (e) => {
      e.preventDefault();
      onStart(e.touches[0].clientX, e.touches[0].clientY);
    }, {passive: false});
    document.addEventListener('touchmove', (e) => {
      if (dragging) { e.preventDefault(); onMove(e.touches[0].clientX, e.touches[0].clientY); }
    }, {passive: false});
    document.addEventListener('touchend', onEnd);
    // PC
    handle.addEventListener('mousedown', (e) => { onStart(e.clientX, e.clientY); });
    document.addEventListener('mousemove', (e) => { onMove(e.clientX, e.clientY); });
    document.addEventListener('mouseup', onEnd);
  });
  
  window.closeAddSubject = function() {
    document.getElementById('addSubjectModal').style.display = 'none';
  };
})();

function memberOrderId(id) {
  return id === 'elliot' ? 1 : id === 'mom' ? 2 : id === 'dad' ? 3 : 0;
}

function memberColor(id) {
  try {
    const saved = JSON.parse(localStorage.getItem('member_colors') || '{}');
    if (saved[id]) return saved[id];
  } catch(e) {}
  return id === 'elliot' ? '#2F66C8' : id === 'mom' ? '#C95F83' : id === 'dad' ? '#3F7F4A' : '#5A5A5A';
}

function darkenColor(hex, amount = 35) {
  const clean = String(hex || '#555555').replace('#', '');
  const full = clean.length === 3 ? clean.split('').map(c => c + c).join('') : clean;
  const n = parseInt(full, 16);
  if (Number.isNaN(n)) return '#333333';
  const r = Math.max(0, ((n >> 16) & 255) - amount);
  const g = Math.max(0, ((n >> 8) & 255) - amount);
  const b = Math.max(0, (n & 255) - amount);
  return '#' + [r, g, b].map(v => v.toString(16).padStart(2, '0')).join('');
}

function saveMemberColor(id, color) {
  try {
    const saved = JSON.parse(localStorage.getItem('member_colors') || '{}');
    saved[id] = color;
    localStorage.setItem('member_colors', JSON.stringify(saved));
  } catch(e) {}
}

function orderedMembers() {
  return [...cachedMembers].sort((a, b) => {
    const ao = memberOrderId(a.id) || 99;
    const bo = memberOrderId(b.id) || 99;
    return ao - bo || String(a.name).localeCompare(String(b.name));
  });
}

  if (stats.total > 0) {
    html += `<div style="font-family:'Gaegu',cursive;font-size:13px;color:#5A8A5E;margin-top:2px;">?뮥 肄붿씤: ${confirmed ? '?뺤젙' : '?덈퉬 +' + pending}</div>`;
  }
  html += `</div>`;
  
  // ?좎쭨 硫붾え (?숈젣?명듃 ?묒씠???ㅽ???
  const memos = dayMemos[dk] || [''];
  html += `<div class="homework-note-card" style="margin-bottom:8px;">`;
  html += `<div class="homework-note-header" style="padding:6px 10px;" onclick="toggleDayMemoNote(event)">`;
  html += `<span class="homework-note-toggle open" id="dayMemoToggleIcon" style="color:white;">??/span>`;
  html += `<div class="homework-note-title-wrap"><span class="homework-note-title">硫붾え</span></div>`;
  html += `<button class="homework-note-expand" onclick="event.stopPropagation(); openDayMemoModal('${dk}');" title="?뺣?">`;
  html += `<svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="white" stroke-width="2" stroke-linecap="round"><circle cx="9" cy="9" r="7"/><line x1="9" y1="5.5" x2="9" y2="12.5"/><line x1="5.5" y1="9" x2="12.5" y2="9"/></svg>`;
  html += `</button>`;
  html += `</div>`;
  html += `<div class="homework-note-body open" id="dayMemoBody">`;
  html += `<div class="homework-note-content" id="dayMemoContent">`;
  memos.forEach((text, i) => {
    html += `<div class="note-line">`;
    html += `<span style="font-family:Gaegu,cursive;font-size:14px;font-weight:700;color:#999;min-width:20px;">${i+1}.</span>`;
    html += `<textarea class="note-input" placeholder="?댁슜???낅젰?섏꽭??.." rows="1" oninput="dayMemos['${dk}'][${i}]=this.value;autoResize(this);debounceSaveDayMemo('${dk}');">${escapeHTML(text)}</textarea>`;
    if (memos.length > 1) {
      html += `<button class="note-delete-btn" onclick="deleteDayMemo('${dk}',${i})">??/button>`;
    }
    html += `</div>`;
  });
  html += `</div>`;
  html += `<button class="note-add-btn" onclick="addDayMemo('${dk}')">+ 硫붾え 異붽?</button>`;
  html += `</div>`;
  html += `</div>`;
  
  body.innerHTML = html;
  body.querySelectorAll('.note-input').forEach(el => autoResize(el));
}

async function loadDayMemo(dk) {
  if (dayMemos[dk]) return;
  try {
    const { data } = await sb.from('day_memos').select('*').eq('date_key', dk).single();
    if (data) {
      dayMemos[dk] = JSON.parse(data.memo_lines || '[""]');
    } else {
      dayMemos[dk] = [''];
    }
  } catch(e) { dayMemos[dk] = ['']; }
}

let dayMemoTimers = {};
function debounceSaveDayMemo(dk) {
  clearTimeout(dayMemoTimers[dk]);
  dayMemoTimers[dk] = setTimeout(() => saveDayMemo(dk), 800);
}

async function saveDayMemo(dk) {
  try {
    await sb.from('day_memos').upsert({
      date_key: dk,
      memo_lines: JSON.stringify(dayMemos[dk] || ['']),
      updated_at: new Date().toISOString()
    }, { onConflict: 'date_key' });
  } catch(e) { console.log('day memo save error', e); }
}

function addDayMemo(dk) {
  if (!dayMemos[dk]) dayMemos[dk] = [];
  dayMemos[dk].push('');
  renderDayDetail(dk);
  saveDayMemo(dk);
  setTimeout(() => {
    const inputs = document.querySelectorAll('#dayDetailBody .note-input');
    if (inputs.length) inputs[inputs.length - 1].focus();
  }, 50);
}

function deleteDayMemo(dk, idx) {
  if (!confirm('吏?멸퉴??')) return;
  dayMemos[dk].splice(idx, 1);
  if (dayMemos[dk].length === 0) dayMemos[dk] = [''];
  renderDayDetail(dk);
  saveDayMemo(dk);
}

/* ?좎쭨硫붾え ?묒씠???좉? */
function toggleDayMemoNote(e) {
  const body = document.getElementById('dayMemoBody');
  const icon = document.getElementById('dayMemoToggleIcon');
  if (body && icon) {
    body.classList.toggle('open');
    icon.classList.toggle('open');
  }
}

/* ?좎쭨硫붾え ?꾩껜李?紐⑤떖 */
let currentDayMemoKey = null;

function openDayMemoModal(dk) {
  currentDayMemoKey = dk;
  const [y, m, d] = dk.split('-').map(Number);
  document.getElementById('dayMemoModalTitle').textContent = `${m}??${d}??硫붾え`;
  renderDayMemoModal(dk);
  document.getElementById('dayMemoModal').classList.add('show');
  setTimeout(() => {
    document.querySelectorAll('#dayMemoModalBody .note-input').forEach(el => autoResize(el));
  }, 50);
}

function closeDayMemoModal() {
  document.getElementById('dayMemoModal').classList.remove('show');
  if (currentDayMemoKey) renderDayDetail(currentDayMemoKey);
  currentDayMemoKey = null;
}

function renderDayMemoModal(dk) {
  const body = document.getElementById('dayMemoModalBody');
  const memos = dayMemos[dk] || [''];
  body.innerHTML = memos.map((text, i) => `
    <div class="note-line">
      <span style="font-family:Gaegu,cursive;font-size:15px;font-weight:700;color:#999;min-width:22px;">${i+1}.</span>
      <textarea class="note-input" placeholder="?댁슜???낅젰?섏꽭??.." rows="1"
        oninput="dayMemos['${dk}'][${i}]=this.value; autoResize(this); debounceSaveDayMemo('${dk}');"
        onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault(); dayMemoLineEnter('${dk}',${i});}">${escapeHTML(text)}</textarea>
      ${memos.length > 1 ? `<button class="note-delete-btn" onclick="deleteDayMemoFromModal('${dk}',${i})">??/button>` : ''}
    </div>
  `).join('');
  body.querySelectorAll('.note-input').forEach(el => autoResize(el));
}

function addDayMemoFromModal() {
  if (!currentDayMemoKey) return;
  const dk = currentDayMemoKey;
  if (!dayMemos[dk]) dayMemos[dk] = [];
  dayMemos[dk].push('');
  renderDayMemoModal(dk);
  saveDayMemo(dk);
  setTimeout(() => {
    const inputs = document.querySelectorAll('#dayMemoModalBody .note-input');
    if (inputs.length) inputs[inputs.length - 1].focus();
  }, 50);
}

function deleteDayMemoFromModal(dk, idx) {
  if (!confirm('吏?멸퉴??')) return;
  dayMemos[dk].splice(idx, 1);
  if (dayMemos[dk].length === 0) dayMemos[dk] = [''];
  renderDayMemoModal(dk);
  saveDayMemo(dk);
}

function dayMemoLineEnter(dk, idx) {
  dayMemos[dk].splice(idx + 1, 0, '');
  renderDayMemoModal(dk);
  saveDayMemo(dk);
  setTimeout(() => {
    const inputs = document.querySelectorAll('#dayMemoModalBody .note-input');
    if (inputs[idx + 1]) inputs[idx + 1].focus();
  }, 50);
}

function toggleCalendar() {
  const body = document.getElementById('calBody');
  const icon = document.getElementById('calToggleIcon');
  if (!body || !icon) return;
  const isOpen = body.style.maxHeight !== '0px';
  body.style.maxHeight = isOpen ? '0px' : '400px';
  icon.style.transform = isOpen ? 'rotate(180deg)' : 'rotate(0deg)';
}

pushHistoryBlock();
initApp();
</script>
